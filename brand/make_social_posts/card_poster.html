<meta charset="utf-8">
<style>
__FONTS__

* { margin:0; padding:0; box-sizing:border-box; }
html,body { background:#000; }

:root{
  --green:#39ff14;
  --cyan:#00e5ff;
  --pink:#ff3ea5;
  --ink:#0a0a0a;
  --white:#ffffff;
  --off:#f5f5f5;
  --muted:#9aa0a6;
}

/* accent = the pick/value colorway, set per card. --accent2 is its partner,
   so every card carries two neons. The brand lockup, the footer wordmark and
   the card frame stay green regardless. */
.card{ --accent:var(--green); --accent-rgb:57,255,20;  --accent-ink:#08120a; --accent-soft:#8fe08a;
       --accent2:var(--pink); --accent2-rgb:255,62,165; }
.accent-cyan{ --accent:var(--cyan); --accent-rgb:0,229,255;  --accent-ink:#03181c; --accent-soft:#8fdfe8;
       --accent2:var(--pink); --accent2-rgb:255,62,165; }
.accent-pink{ --accent:var(--pink); --accent-rgb:255,62,165; --accent-ink:#1c0410; --accent-soft:#f0a8c9;
       --accent2:var(--cyan); --accent2-rgb:0,229,255; }

.card{
  position:relative;
  width:1080px;
  height:1350px;
  overflow:hidden;
  background:#040404;
  font-family:'Barlow Condensed', system-ui, sans-serif;
  color:var(--white);
}

/* ── backdrop: the same photo, blurred out to a wash so the sides of the
      panel aren't dead black ── */
.bg{
  position:absolute; inset:-60px; z-index:0;
  background-image:url("__IMG__");
  background-repeat:no-repeat;
  background-size:cover;
  background-position:50% 30%;
  filter:blur(42px) grayscale(.7) brightness(.34) contrast(1.1);
}
.bg-wash{
  position:absolute; inset:0; z-index:1;
  background:
    radial-gradient(620px 620px at 50% 44%, rgba(var(--accent-rgb),.14), transparent 70%),
    radial-gradient(1000px 900px at 50% 46%, rgba(3,3,3,.55), rgba(3,3,3,.92) 78%),
    linear-gradient(180deg, rgba(3,3,3,.92) 0%, transparent 20%, transparent 62%, rgba(3,3,3,.96) 100%);
}
.jersey-no{
  position:absolute; z-index:2; top:196px; left:0; right:0; text-align:center;
  font-weight:800; font-size:520px; line-height:.8; color:rgba(255,255,255,.045);
  letter-spacing:-.04em;
}

/* inner trading-card frame */
.frame{
  position:absolute; z-index:9; inset:22px;
  border:1.5px solid rgba(57,255,20,.28);
  border-radius:20px;
  box-shadow:0 0 0 1px rgba(0,0,0,.6) inset, 0 0 34px rgba(57,255,20,.10) inset;
  pointer-events:none;
}

.inner{ position:absolute; z-index:5; inset:22px; display:flex; flex-direction:column; }

/* ── header ── */
.header{ display:flex; align-items:flex-start; justify-content:space-between; padding:32px 42px 0; }
.brand{ display:flex; align-items:center; gap:12px; }
.brand-slam{ font-weight:800; font-size:40px; letter-spacing:.02em; line-height:.9; color:#fff; }
.brand-bets{
  font-weight:800; font-size:22px; letter-spacing:.34em; color:#0a0a0a;
  background:var(--green); padding:5px 12px 4px 16px; border-radius:5px;
  box-shadow:0 0 18px rgba(57,255,20,.55);
}
.tag{ text-align:right; line-height:1; }
.tag-league{
  display:inline-block; font-weight:800; font-size:20px; letter-spacing:.28em; color:var(--cyan);
  border:1.5px solid rgba(0,229,255,.55); border-radius:999px; padding:7px 16px 5px;
  box-shadow:0 0 16px rgba(0,229,255,.20);
}
.tag-sub{ display:block; margin-top:10px; font-weight:600; font-size:17px; letter-spacing:.30em; color:#c2c7cc; }

/* ── the stage: a contained portrait panel flanked by the two prices ── */
.stage{ position:relative; flex:1; }

.panel{
  position:absolute; top:10px; left:50%; transform:translateX(-50%);
  width:530px; height:930px;
  border-radius:18px; overflow:hidden;
  border:1.5px solid rgba(var(--accent-rgb),.55);
  box-shadow:0 0 0 1px rgba(0,0,0,.75), 0 0 46px rgba(var(--accent-rgb),.18),
             0 26px 60px rgba(0,0,0,.75);
}
.photo{
  position:absolute; inset:0;
  background-image:url("__IMG__");
  background-repeat:no-repeat;
  background-size:{{PHOTO_SIZE}};
  background-position:{{PHOTO_POS}};
  filter:{{PHOTO_FILTER}};
}
/* scrim only inside the panel, so the name can sit on the photo */
.panel-scrim{
  position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(4,4,4,.30) 0%, transparent 22%,
             transparent 52%, rgba(4,4,4,.86) 88%, rgba(4,4,4,.96) 100%);
}
.who{ position:absolute; left:0; right:0; bottom:26px; padding:0 24px; text-align:center; }
.kicker{
  font-weight:700; font-size:17px; letter-spacing:.30em; color:var(--accent);
  text-shadow:0 0 16px rgba(var(--accent-rgb),.65); margin-bottom:4px;
}
.name{ font-weight:800; font-size:56px; line-height:.9; color:#fff; text-shadow:0 3px 22px rgba(0,0,0,.9); }
.meta{ margin-top:8px; font-weight:600; font-size:20px; letter-spacing:.14em; color:var(--cyan); }
.meta b{ color:#e9ecef; font-weight:700; }

/* the flanking price columns — model on the left, what's on the board on the
   right, the panel between them doing the arguing */
.side{
  position:absolute; top:0; bottom:0; width:258px;
  display:flex; flex-direction:column; justify-content:center; text-align:center;
}
.side-l{ left:22px; }
.side-r{ right:22px; }
.side-k{ font-weight:700; font-size:16px; letter-spacing:.24em; color:var(--muted); }
.side-v{ margin-top:6px; font-weight:800; font-size:64px; line-height:.92; color:#dfe3e7; }
.side-r .side-k{ color:var(--accent-soft); }
.side-r .side-v{
  font-size:88px; color:var(--accent);
  text-shadow:0 0 22px rgba(var(--accent-rgb),.55), 0 0 70px rgba(var(--accent-rgb),.35);
}
.side-book{
  display:inline-block; margin:0 auto 14px; font-weight:800; font-size:19px; letter-spacing:.20em;
  color:var(--accent); border:1.5px solid rgba(var(--accent-rgb),.6); border-radius:999px;
  padding:7px 15px 5px; box-shadow:0 0 20px rgba(var(--accent-rgb),.20);
}
.side-rule{ width:64px; height:1.5px; margin:22px auto; background:#2a2a2a; }
.side-stake-k{ font-weight:700; font-size:16px; letter-spacing:.24em; color:var(--muted); }
.side-stake-v{ margin-top:5px; font-weight:800; font-size:44px; line-height:1; color:#e9ecef; }

/* ── the pick, on its own band under the panel ── */
.pick{ text-align:center; padding:0 60px; margin-top:6px; }
.pick-label{
  font-weight:700; font-size:17px; letter-spacing:.36em; color:var(--accent2);
  text-shadow:0 0 14px rgba(var(--accent2-rgb),.45);
}
.pick-line{ display:flex; align-items:center; justify-content:center; gap:16px; margin-top:10px; }
.pick-text{ font-weight:800; font-size:58px; line-height:.92; color:#fff; letter-spacing:.02em; }
.chip{
  font-weight:800; font-size:32px; line-height:1; letter-spacing:.02em;
  color:var(--accent-ink); background:var(--accent); border-radius:8px; padding:9px 14px 6px;
  box-shadow:0 0 22px rgba(var(--accent-rgb),.45);
}
.note{ margin-top:10px; font-weight:500; font-size:21px; color:var(--muted); }

/* ── footer ── */
.footer{ display:flex; align-items:center; justify-content:space-between; padding:22px 44px 26px; }
.site{ font-weight:800; font-size:28px; letter-spacing:.03em; color:var(--green); text-shadow:0 0 16px rgba(57,255,20,.4); }
.disc{ font-family:system-ui,sans-serif; font-size:15px; letter-spacing:.02em; color:#6b7075; }
</style>

<div class="card accent-{{ACCENT}}">
  <div class="bg"></div>
  <div class="bg-wash"></div>
  <div class="jersey-no">{{JERSEY}}</div>

  <div class="inner">
    <div class="header">
      <div class="brand">
        <span class="brand-slam">SLAM DUNK</span>
        <span class="brand-bets">BETS</span>
      </div>
      <div class="tag">
        <span class="tag-league">{{LEAGUE}}</span>
        <span class="tag-sub">{{TAG_SUB}}</span>
      </div>
    </div>

    <div class="stage">
      <div class="side side-l">
        <div>
          <div class="side-k">MODEL PROJ</div>
          <div class="side-v">{{PROJ}}</div>
        </div>
      </div>

      <div class="panel">
        <div class="photo"></div>
        <div class="panel-scrim"></div>
        <div class="who">
          <div class="kicker">{{KICKER}}</div>
          <div class="name">{{NAME}}</div>
          <div class="meta"><b>{{TEAM}}</b> &nbsp;•&nbsp; #{{JERSEY}}</div>
        </div>
      </div>

      <div class="side side-r">
        <div>
          <span class="side-book">{{BOOK}}</span>
          <div class="side-k">AVAILABLE</div>
          <div class="side-v">{{ODDS}}</div>
          <div class="side-rule"></div>
          <div class="side-stake-k">STAKE</div>
          <div class="side-stake-v">{{STAKE}}</div>
        </div>
      </div>
    </div>

    <div class="pick">
      <div class="pick-label">{{PICK_LABEL}}</div>
      <div class="pick-line">
        {{CHIP_HTML}}
        <span class="pick-text">{{PICK_TEXT}}</span>
      </div>
      {{NOTE_HTML}}
    </div>

    <div class="footer">
      <span class="site">slamdunk.bet</span>
      <span class="disc">21+ · Gamble responsibly · 1-800-GAMBLER</span>
    </div>
  </div>

  <div class="frame"></div>
</div>
