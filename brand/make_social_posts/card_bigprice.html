<meta charset="utf-8">
<style>
__FONTS__

* { margin:0; padding:0; box-sizing:border-box; }
html,body { background:#000; }

:root{
  --green:#39ff14;
  --cyan:#00e5ff;
  --pink:#ff3ea5;
  --ink:#0a0a0a;
  --white:#ffffff;
  --off:#f5f5f5;
  --muted:#9aa0a6;
}

/* accent = the pick/value colorway, set per card. --accent2 is its partner,
   so every card carries two neons. The brand lockup, the footer wordmark and
   the card frame stay green regardless. */
.card{ --accent:var(--green); --accent-rgb:57,255,20;  --accent-ink:#08120a; --accent-soft:#8fe08a;
       --accent2:var(--pink); --accent2-rgb:255,62,165; }
.accent-cyan{ --accent:var(--cyan); --accent-rgb:0,229,255;  --accent-ink:#03181c; --accent-soft:#8fdfe8;
       --accent2:var(--pink); --accent2-rgb:255,62,165; }
.accent-pink{ --accent:var(--pink); --accent-rgb:255,62,165; --accent-ink:#1c0410; --accent-soft:#f0a8c9;
       --accent2:var(--cyan); --accent2-rgb:0,229,255; }

.card{
  position:relative;
  width:1080px;
  height:1350px;
  overflow:hidden;
  background:#040404;
  font-family:'Barlow Condensed', system-ui, sans-serif;
  color:var(--white);
}

/* ── photo is atmosphere, not subject: full bleed and graded way down ── */
.shade{ position:absolute; inset:0; z-index:0; filter:grayscale(.55) brightness(.52) contrast(1.06); }
.photo{
  position:absolute; inset:0;
  background-image:url("__IMG__");
  background-repeat:no-repeat;
  background-size:{{PHOTO_SIZE}};
  background-position:{{PHOTO_POS}};
  filter:{{PHOTO_FILTER}};
}
.wash{
  position:absolute; inset:0; z-index:1;
  background:
    radial-gradient(760px 620px at 50% 46%, rgba(var(--accent-rgb),.16), transparent 66%),
    radial-gradient(900px 760px at 50% 46%, rgba(2,2,2,.72), rgba(2,2,2,.90) 70%);
}
.wash-edge{
  position:absolute; inset:0; z-index:1;
  background:
    linear-gradient(180deg, rgba(3,3,3,.92) 0%, transparent 26%, transparent 66%, rgba(3,3,3,.95) 100%);
}
.jersey-no{
  position:absolute; z-index:2; top:150px; left:52px;
  font-weight:800; font-size:210px; line-height:.8; color:rgba(255,255,255,.05);
  letter-spacing:-.03em;
}

/* inner trading-card frame */
.frame{
  position:absolute; z-index:7; inset:22px;
  border:1.5px solid rgba(57,255,20,.28);
  border-radius:20px;
  box-shadow:0 0 0 1px rgba(0,0,0,.6) inset, 0 0 34px rgba(57,255,20,.10) inset;
  pointer-events:none;
}

.inner{ position:absolute; z-index:5; inset:22px; display:flex; flex-direction:column; }

/* ── header ── */
.header{ display:flex; align-items:flex-start; justify-content:space-between; padding:34px 42px 0; }
.brand{ display:flex; align-items:center; gap:12px; }
.brand-slam{ font-weight:800; font-size:40px; letter-spacing:.02em; line-height:.9; color:#fff; }
.brand-bets{
  font-weight:800; font-size:22px; letter-spacing:.34em; color:#0a0a0a;
  background:var(--green); padding:5px 12px 4px 16px; border-radius:5px;
  box-shadow:0 0 18px rgba(57,255,20,.55);
}
.tag{ text-align:right; line-height:1; }
.tag-league{
  display:inline-block; font-weight:800; font-size:20px; letter-spacing:.28em; color:var(--cyan);
  border:1.5px solid rgba(0,229,255,.55); border-radius:999px; padding:7px 16px 5px;
  box-shadow:0 0 16px rgba(0,229,255,.20);
}
.tag-sub{ display:block; margin-top:10px; font-weight:600; font-size:17px; letter-spacing:.30em; color:#c2c7cc; }

/* ── the pick, small and centred, above the number ── */
.pick{ text-align:center; margin-top:54px; padding:0 60px; }
.pick-label{
  font-weight:700; font-size:18px; letter-spacing:.36em; color:var(--accent2);
  text-shadow:0 0 14px rgba(var(--accent2-rgb),.45);
}
.pick-text{ margin-top:10px; font-weight:800; font-size:62px; line-height:.92; color:#fff; letter-spacing:.02em; }
.note{ margin-top:12px; font-weight:500; font-size:22px; color:var(--muted); }

/* ── the available price is the whole card ── */
.hero{ margin:auto 0; text-align:center; }
.book{
  display:inline-block; font-weight:800; font-size:24px; letter-spacing:.26em;
  color:var(--accent); border:1.5px solid rgba(var(--accent-rgb),.6); border-radius:999px;
  padding:9px 24px 6px; box-shadow:0 0 22px rgba(var(--accent-rgb),.22);
}
.odds{
  margin-top:6px; font-weight:800; font-size:300px; line-height:.9; letter-spacing:-.02em;
  color:var(--accent); white-space:nowrap;
  text-shadow:0 0 20px rgba(var(--accent-rgb),.55), 0 0 90px rgba(var(--accent-rgb),.40);
}
.legs{ display:flex; align-items:stretch; justify-content:center; gap:0; margin-top:38px; }
.leg{ padding:0 58px; text-align:center; }
.leg + .leg{ border-left:1.5px solid #262626; }
.leg-k{ display:block; font-weight:700; font-size:18px; letter-spacing:.22em; color:var(--muted); }
.leg-v{ display:block; margin-top:8px; font-weight:800; font-size:52px; line-height:1; color:#e9ecef; }

/* ── name bar, bottom left ── */
.who{ padding:0 44px; }
.kicker{
  font-weight:700; font-size:19px; letter-spacing:.30em; color:var(--accent);
  text-shadow:0 0 16px rgba(var(--accent-rgb),.6); margin-bottom:4px;
}
.name{ font-weight:800; font-size:84px; line-height:.88; color:#fff; text-shadow:0 3px 26px rgba(0,0,0,.85); }
.meta{ margin-top:10px; font-weight:600; font-size:24px; letter-spacing:.14em; color:var(--cyan); }
.meta b{ color:#e9ecef; font-weight:700; }

/* ── footer ── */
.footer{ display:flex; align-items:center; justify-content:space-between; padding:28px 44px 30px; }
.site{ font-weight:800; font-size:28px; letter-spacing:.03em; color:var(--green); text-shadow:0 0 16px rgba(57,255,20,.4); }
.disc{ font-family:system-ui,sans-serif; font-size:15px; letter-spacing:.02em; color:#6b7075; }
</style>

<div class="card accent-{{ACCENT}}">
  <div class="shade"><div class="photo"></div></div>
  <div class="wash"></div>
  <div class="wash-edge"></div>
  <div class="jersey-no">{{JERSEY}}</div>

  <div class="inner">
    <div class="header">
      <div class="brand">
        <span class="brand-slam">SLAM DUNK</span>
        <span class="brand-bets">BETS</span>
      </div>
      <div class="tag">
        <span class="tag-league">{{LEAGUE}}</span>
        <span class="tag-sub">{{TAG_SUB}}</span>
      </div>
    </div>

    <div class="pick">
      <div class="pick-label">{{PICK_LABEL}}</div>
      <div class="pick-text">{{PICK_TEXT}}</div>
      {{NOTE_HTML}}
    </div>

    <div class="hero">
      <span class="book">{{BOOK}}</span>
      <div class="odds">{{ODDS}}</div>
      <div class="legs">
        <div class="leg">
          <span class="leg-k">MODEL PROJ</span>
          <span class="leg-v">{{PROJ}}</span>
        </div>
        <div class="leg">
          <span class="leg-k">STAKE</span>
          <span class="leg-v">{{STAKE}}</span>
        </div>
      </div>
    </div>

    <div class="who">
      <div class="kicker">{{KICKER}}</div>
      <div class="name">{{NAME}}</div>
      <div class="meta"><b>{{TEAM}}</b> &nbsp;•&nbsp; #{{JERSEY}}</div>
    </div>

    <div class="footer">
      <span class="site">slamdunk.bet</span>
      <span class="disc">21+ · Gamble responsibly · 1-800-GAMBLER</span>
    </div>
  </div>

  <div class="frame"></div>
</div>
