<meta charset="utf-8">
<style>
__FONTS__

* { margin:0; padding:0; box-sizing:border-box; }
html,body { background:#000; }

:root{
  --green:#39ff14;
  --cyan:#00e5ff;
  --pink:#ff3ea5;
  --ink:#0a0a0a;
  --white:#ffffff;
  --off:#f5f5f5;
  --muted:#9aa0a6;
}

/* accent = the pick/value colorway, set per card. --accent2 is its partner,
   so every card carries two neons. The brand lockup, the footer wordmark and
   the card frame stay green regardless. */
.card{ --accent:var(--green); --accent-rgb:57,255,20;  --accent-ink:#08120a; --accent-soft:#8fe08a;
       --accent2:var(--pink); --accent2-rgb:255,62,165; }
.accent-cyan{ --accent:var(--cyan); --accent-rgb:0,229,255;  --accent-ink:#03181c; --accent-soft:#8fdfe8;
       --accent2:var(--pink); --accent2-rgb:255,62,165; }
.accent-pink{ --accent:var(--pink); --accent-rgb:255,62,165; --accent-ink:#1c0410; --accent-soft:#f0a8c9;
       --accent2:var(--cyan); --accent2-rgb:0,229,255; }

.card{
  position:relative;
  width:1080px;
  height:1350px;
  overflow:hidden;
  background:#050505;
  font-family:'Barlow Condensed', system-ui, sans-serif;
  color:var(--white);
}

/* ── photo runs the full 1080x1350: a tall portrait crop, not a band ── */
.photo{
  position:absolute; inset:0; z-index:0;
  background-image:url("__IMG__");
  background-repeat:no-repeat;
  background-size:{{PHOTO_SIZE}};
  background-position:{{PHOTO_POS}};
  filter:{{PHOTO_FILTER}};
}
.vignette{ position:absolute; inset:0; z-index:1; box-shadow:inset 0 0 220px 70px rgba(0,0,0,.68); }
.scrim-top{
  position:absolute; left:0; right:0; top:0; height:26%; z-index:2;
  background:linear-gradient(180deg, rgba(5,5,5,.93) 0%, rgba(5,5,5,.52) 48%, transparent 100%);
}
.scrim{
  position:absolute; left:0; right:0; bottom:0; height:64%; z-index:2;
  background:linear-gradient(180deg, transparent 0%, rgba(4,4,4,.34) 24%, rgba(4,4,4,.80) 54%, rgba(3,3,3,.95) 78%, #030303 100%);
}
.jersey-no{
  position:absolute; z-index:3; top:196px; right:44px;
  font-weight:800; font-size:250px; line-height:.8; color:rgba(255,255,255,.055);
  letter-spacing:-.03em;
}

/* inner trading-card frame */
.frame{
  position:absolute; z-index:7; inset:22px;
  border:1.5px solid rgba(57,255,20,.28);
  border-radius:20px;
  box-shadow:0 0 0 1px rgba(0,0,0,.6) inset, 0 0 34px rgba(57,255,20,.10) inset;
  pointer-events:none;
}

.inner{ position:absolute; z-index:5; inset:22px; display:flex; flex-direction:column; }

/* ── header ── */
.header{ display:flex; align-items:flex-start; justify-content:space-between; padding:34px 42px 0; }
.brand{ display:flex; align-items:center; gap:12px; }
.brand-slam{ font-weight:800; font-size:40px; letter-spacing:.02em; line-height:.9; color:#fff; }
.brand-bets{
  font-weight:800; font-size:22px; letter-spacing:.34em; color:#0a0a0a;
  background:var(--green); padding:5px 12px 4px 16px; border-radius:5px;
  box-shadow:0 0 18px rgba(57,255,20,.55);
}
.tag{ text-align:right; line-height:1; }
.tag-league{
  display:inline-block; font-weight:800; font-size:20px; letter-spacing:.28em; color:var(--cyan);
  border:1.5px solid rgba(0,229,255,.55); border-radius:999px; padding:7px 16px 5px;
  box-shadow:0 0 16px rgba(0,229,255,.20);
}
.tag-sub{ display:block; margin-top:10px; font-weight:600; font-size:17px; letter-spacing:.30em; color:#c2c7cc; }

/* ── vertical rail: the pick label reads bottom-to-top up the left edge ── */
.rail{
  position:absolute; z-index:6; left:14px; top:0; bottom:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
}
.rail i{ display:block; width:2px; height:76px; background:linear-gradient(180deg, transparent, var(--accent)); }
.rail i.down{ background:linear-gradient(180deg, var(--accent), transparent); }
.rail span{
  writing-mode:vertical-rl; transform:rotate(180deg);
  font-weight:700; font-size:18px; letter-spacing:.44em; white-space:nowrap;
  color:var(--accent); text-shadow:0 0 16px rgba(var(--accent-rgb),.55);
}

/* ── bottom stack, pushed off the left rail ── */
.stack{ margin-top:auto; padding:0 46px 0 92px; }
.kicker{
  font-weight:700; font-size:20px; letter-spacing:.30em; color:var(--accent);
  text-shadow:0 0 16px rgba(var(--accent-rgb),.6); margin-bottom:4px;
}
.name{
  font-weight:800; font-size:112px; line-height:.84; letter-spacing:.005em; color:#fff;
  text-shadow:0 3px 30px rgba(0,0,0,.9);
}
.meta{ margin-top:12px; font-weight:600; font-size:26px; letter-spacing:.14em; color:var(--cyan); }
.meta b{ color:#e9ecef; font-weight:700; }
.pick-row{ display:flex; align-items:center; gap:16px; margin-top:20px; }
.chip{
  font-weight:800; font-size:40px; line-height:1; color:var(--accent-ink);
  background:var(--accent); padding:9px 15px 6px; border-radius:10px;
  box-shadow:0 0 28px rgba(var(--accent-rgb),.5);
}
.pick-text{ font-weight:800; font-size:52px; line-height:.9; color:#fff; letter-spacing:.02em; }
.note{ margin-top:12px; font-weight:500; font-size:23px; letter-spacing:.02em; color:var(--muted); }

/* ── one price bar: expected → available → stake ── */
.pricebar{
  display:flex; align-items:center; gap:28px; margin-top:26px;
  padding:20px 28px 17px;
  border:1.5px solid #242424; border-left:5px solid var(--accent); border-radius:16px;
  background:linear-gradient(90deg, rgba(var(--accent-rgb),.10), rgba(9,9,9,.90) 42%, rgba(9,9,9,.90));
  box-shadow:0 0 44px rgba(var(--accent-rgb),.14);
}
.leg{ display:flex; flex-direction:column; }
.leg-k{ font-weight:700; font-size:17px; letter-spacing:.20em; color:var(--muted); white-space:nowrap; }
.leg-v{ font-weight:800; font-size:58px; line-height:1; margin-top:5px; color:#fff; }
.leg.best .leg-k{ color:var(--accent); }
.leg.best .leg-v{ color:var(--accent); text-shadow:0 0 26px rgba(var(--accent-rgb),.45); }
.arrow{ font-weight:800; font-size:30px; color:var(--accent); opacity:.7; margin-top:14px; }
.stake{ margin-left:auto; display:flex; flex-direction:column; align-items:flex-end; }
.stake-k{ font-weight:700; font-size:17px; letter-spacing:.20em; color:var(--muted); }
.stake-v{
  margin-top:6px; font-weight:800; font-size:34px; line-height:1; color:#c2c7cc;
  border:1.5px solid #2c2c2c; border-radius:999px; padding:7px 20px 4px;
}

/* ── footer ── */
.footer{ display:flex; align-items:center; justify-content:space-between; padding:22px 44px 30px; }
.site{ font-weight:800; font-size:28px; letter-spacing:.03em; color:var(--green); text-shadow:0 0 16px rgba(57,255,20,.4); }
.disc{ font-family:system-ui,sans-serif; font-size:15px; letter-spacing:.02em; color:#6b7075; }
</style>

<div class="card accent-{{ACCENT}}">
  <div class="photo"></div>
  <div class="vignette"></div>
  <div class="scrim-top"></div>
  <div class="scrim"></div>
  <div class="jersey-no">{{JERSEY}}</div>

  <div class="inner">
    <div class="header">
      <div class="brand">
        <span class="brand-slam">SLAM DUNK</span>
        <span class="brand-bets">BETS</span>
      </div>
      <div class="tag">
        <span class="tag-league">{{LEAGUE}}</span>
        <span class="tag-sub">{{TAG_SUB}}</span>
      </div>
    </div>

    <div class="rail">
      <i></i>
      <span>{{PICK_LABEL}}</span>
      <i class="down"></i>
    </div>

    <div class="stack">
      <div class="kicker">{{KICKER}}</div>
      <div class="name">{{NAME}}</div>
      <div class="meta"><b>{{TEAM}}</b> &nbsp;•&nbsp; #{{JERSEY}}</div>
      <div class="pick-row">
        {{CHIP_HTML}}
        <span class="pick-text">{{PICK_TEXT}}</span>
      </div>
      {{NOTE_HTML}}
      <div class="pricebar">
        <div class="leg">
          <span class="leg-k">MODEL</span>
          <span class="leg-v">{{PROJ}}</span>
        </div>
        <span class="arrow">▶</span>
        <div class="leg best">
          <span class="leg-k">{{BOOK}}</span>
          <span class="leg-v">{{ODDS}}</span>
        </div>
        <div class="stake">
          <span class="stake-k">STAKE</span>
          <span class="stake-v">{{STAKE}}</span>
        </div>
      </div>
    </div>

    <div class="footer">
      <span class="site">slamdunk.bet</span>
      <span class="disc">21+ · Gamble responsibly · 1-800-GAMBLER</span>
    </div>
  </div>

  <div class="frame"></div>
</div>
